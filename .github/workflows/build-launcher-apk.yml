name: Build Personal Launcher APK

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install Android SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore persistent APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
          LAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$LAUNCHER_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set LAUNCHER_KEYSTORE_BASE64 and LAUNCHER_KEYSTORE_PASSWORD repository secrets. Refusing to publish another temporary-key APK that cannot update existing installations."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/personal-launcher.p12"
          keytool -list -keystore "$RUNNER_TEMP/personal-launcher.p12" -storepass:env LAUNCHER_KEYSTORE_PASSWORD -alias personal-launcher > /dev/null

      - name: Build release APK
        working-directory: launcher
        env:
          LAUNCHER_KEYSTORE_PATH: ${{ runner.temp }}/personal-launcher.p12
          LAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --console=plain

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs launcher/app/build/outputs/apk/release/app-release.apk'

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/personal-launcher.p12"

      - name: Prepare APK
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk PersonalLauncher.apk
          ls -la PersonalLauncher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalLauncher-apk
          path: PersonalLauncher.apk

      - name: Create GitHub release
        run: |
          TAG="v4.5-build-${{ github.run_number }}"
          gh release create "$TAG" PersonalLauncher.apk --title "Personal Launcher 4.5 (build ${{ github.run_number }})" --notes "Personal Launcher 4.5: persistent settings navigation, clean proportional logos with subtle raised cards, wider aurora wallpaper framing, and volume-only quick controls. Uses the same persistent signing key as 4.3."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
