name: Compose phone test APK
on:
  push:
    branches: [test/compose-phone-apk]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Build and verify installable test APK
        working-directory: launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          text = p.read_text()
          start = text.index('        <activity-alias')
          end = text.index('        </activity-alias>', start)
          alias = text[start:end]
          a = alias.index('            <intent-filter>')
          b = alias.index('            </intent-filter>', a) + len('            </intent-filter>')
          p.write_text(text[:start] + alias[:a] + alias[b:] + text[end:])
          PY
          bash ./gradlew --no-daemon -PlauncherApplicationId=com.sadique.launcher.composetest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PersonalLauncher-Compose-Test.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$RUNNER_TEMP/PersonalLauncher-Compose-Test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Compose-Phone-Test
          path: ${{ runner.temp }}/PersonalLauncher-Compose-Test.apk
          if-no-files-found: error
          retention-days: 3
