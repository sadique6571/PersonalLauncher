plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sadique.launcher'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.sadique.launcher')
        minSdk 26
        targetSdk 34
        versionCode 98
        // Use the exact GitHub release build identifier for published APKs.
        def runNumber = providers.environmentVariable('GITHUB_RUN_NUMBER').orNull
        def releaseWorkflow = providers.environmentVariable('GITHUB_WORKFLOW').orNull == 'Build Personal Launcher APK'
        def buildNumber = releaseWorkflow && (runNumber ==~ /[0-9]+/) ? runNumber : versionCode.toString()
        resValue 'string', 'launcher_build_number', buildNumber
        versionName '7.0'
    }

    // CI may compile with the debug key; published APKs require the persistent release key.
    signingConfigs {
        personalRelease {
            def keyPath = System.getenv('LAUNCHER_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('LAUNCHER_KEYSTORE_PASSWORD')
                keyAlias 'personal-launcher'
                keyPassword System.getenv('LAUNCHER_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('LAUNCHER_KEYSTORE_PATH') ? signingConfigs.personalRelease : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'DebugProbesKt.bin']
        }
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion = '1.5.15' }
    kotlinOptions { jvmTarget = '17' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation:1.7.5'
    implementation 'androidx.tv:tv-material:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Optional local ADB boot recovery; dependency rationale and boundaries: issue #16.
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Real JSON implementation for local profile/watchlist JVM tests; never packaged in the APK.
    testImplementation 'org.json:json:20240303'
}

// Package the reviewed wrapper from its single source; no copied/prebuilt helper binary.
def volumeAssets = layout.buildDirectory.dir('generated/volumeAssets')
tasks.register('prepareVolumeAssets', Copy) {
    from rootProject.file('../tools/fast-volume-bridge.sh')
    into volumeAssets
}
android.sourceSets.main.assets.srcDir(volumeAssets)
tasks.named('preBuild').configure { dependsOn('prepareVolumeAssets') }


